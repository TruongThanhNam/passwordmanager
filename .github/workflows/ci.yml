# CI cho mọi PR và push lên main (AD-19).
# Workflow PR chỉ đọc repo và không tham chiếu GitHub Secrets (AD-18).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Chỉ hủy lần chạy cũ của PR; mỗi commit trên main đều phải có CI.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.47.8'

defaults:
  run:
    shell: bash
    working-directory: pak_manager

jobs:
  android:
    name: Analyze, test, build Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Workflow PR không dùng secret
        working-directory: .
        run: |
          # Bắt mọi dạng truy cập context secret: dấu chấm, ngoặc vuông, toJSON(...).
          if grep -nE 'secret[s]([^A-Za-z0-9_]|$)|pull_request[_]target' .github/workflows/ci.yml; then
            echo "ci.yml không được tham chiếu secret hay dùng trigger pull-request-target (AD-18)" >&2
            exit 1
          fi
          echo "OK: ci.yml không tham chiếu secret"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          # Tag có thể bị dời: so revision thật với .metadata (AD-12, AD-18).
          expected="$(grep -m1 -E '^  revision:' .metadata | grep -oE '[0-9a-f]{40}' || true)"
          actual="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "Flutter clone có revision $actual, khác revision '$expected' trong .metadata" >&2
            exit 1
          fi
          echo "OK: Flutter revision $actual khớp .metadata"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: |
          flutter config --no-analytics
          flutter --version

      - name: Pub get (theo pubspec.lock)
        run: flutter pub get --enforce-lockfile

      - name: Kiểm Stack (AD-12)
        run: dart run tool/ci/check_stack.dart

      - name: Code gen-l10n đã cập nhật (AD-23, AD-19)
        run: |
          flutter gen-l10n
          # Bắt cả file sinh ra bị sửa tay, bị xóa hay chưa commit.
          changes="$(git status --porcelain -- lib/l10n)"
          if [[ -n "$changes" ]]; then
            echo "$changes"
            git --no-pager diff -- lib/l10n
            echo "Code gen-l10n chưa khớp lib/l10n/*.arb; chạy lại 'flutter gen-l10n' rồi commit lib/l10n" >&2
            exit 1
          fi
          echo "OK: code gen-l10n khớp lib/l10n/*.arb"

      - name: Code Pigeon sinh ra đã cập nhật (AD-14, AD-19)
        run: |
          dart run pigeon --input pigeons/platform_api.dart
          # Bắt cả file bị sửa tay, bị xóa (thiếu), chưa commit hay output mới.
          changes="$(git status --porcelain -- lib android ios)"
          if [[ -n "$changes" ]]; then
            echo "$changes"
            git --no-pager diff -- lib android ios
            echo "Code Pigeon chưa khớp pigeons/platform_api.dart; chạy lại 'dart run pigeon --input pigeons/platform_api.dart' rồi commit" >&2
            exit 1
          fi
          echo "OK: code Pigeon khớp pigeons/platform_api.dart"

      - name: Fixture vault khớp script (AD-20)
        run: |
          # Script tự build libsodium qua build hook của sodium (gcc/make có sẵn).
          dart run tool/fixtures/gen_vault_v1.dart
          changes="$(git status --porcelain -- test/fixtures/vault)"
          if [[ -n "$changes" ]]; then
            echo "$changes"
            git --no-pager diff --stat -- test/fixtures/vault
            echo "Fixture vault chưa khớp tool/fixtures/gen_vault_v1.dart; chạy lại script rồi commit test/fixtures/vault" >&2
            exit 1
          fi
          echo "OK: fixture vault khớp script"

      - name: Phân tích tĩnh
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Luật import (AD-1, AD-2)
        run: dart run tool/check_imports.dart

      - name: Unit + widget test
        run: flutter test

      - name: Build APK release (prod)
        run: flutter build apk --release --flavor prod --build-number "$GITHUB_RUN_NUMBER"

      - name: Kiểm APK (INTERNET, backup, 16 KB)
        run: bash tool/ci/check_android_apk.sh build/app/outputs/flutter-apk/app-prod-release.apk

  ios:
    name: Build iOS (no codesign)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Chọn Xcode 26.3
        run: |
          test -d /Applications/Xcode_26.3.app || { echo "Xcode 26.3 không có trên runner macos-15" >&2; exit 1; }
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Cài Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          # Tag có thể bị dời: so revision thật với .metadata (AD-12, AD-18).
          expected="$(grep -m1 -E '^  revision:' .metadata | grep -oE '[0-9a-f]{40}' || true)"
          actual="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "Flutter clone có revision $actual, khác revision '$expected' trong .metadata" >&2
            exit 1
          fi
          echo "OK: Flutter revision $actual khớp .metadata"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: |
          flutter config --no-analytics
          flutter --version

      - name: Pub get (theo pubspec.lock)
        run: flutter pub get --enforce-lockfile

      - name: Build iOS release
        run: flutter build ios --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"
