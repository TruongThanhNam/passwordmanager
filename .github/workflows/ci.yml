# CI cho mọi PR và push lên main (AD-19).
# Workflow PR chỉ đọc repo và không tham chiếu secret của GitHub (AD-18).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Chỉ hủy lần chạy cũ của PR; mỗi commit trên main đều phải có CI.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.47.8'

defaults:
  run:
    shell: bash
    working-directory: pak_manager

jobs:
  android:
    name: Analyze, test, build Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          # Tag có thể bị dời: so revision thật với .metadata (AD-12, AD-18).
          expected="$(grep -m1 -E '^  revision:' .metadata | grep -oE '[0-9a-f]{40}' || true)"
          actual="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "Flutter clone có revision $actual, khác revision '$expected' trong .metadata" >&2
            exit 1
          fi
          echo "OK: Flutter revision $actual khớp .metadata"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: |
          flutter config --no-analytics
          flutter --version

      - name: Pub get (theo pubspec.lock)
        run: flutter pub get --enforce-lockfile

      - name: Workflow PR không dùng secret (AD-18)
        # Luật và kiểm âm ở test/tool/. Glob `secret[s]` để chính dòng này
        # không khớp luật quét (bash mở glob thành tên file thật).
        run: dart run tool/ci/check_workflow_secret[s].dart ../.github/workflows/ci.yml

      - name: Kiểm Stack (AD-12)
        run: dart run tool/ci/check_stack.dart

      - name: Code gen-l10n đã cập nhật (AD-23, AD-19)
        run: |
          flutter gen-l10n
          # Bắt cả file sinh ra bị sửa tay, bị xóa hay chưa commit.
          changes="$(git status --porcelain -- lib/l10n)"
          if [[ -n "$changes" ]]; then
            echo "$changes"
            git --no-pager diff -- lib/l10n
            echo "Code gen-l10n chưa khớp lib/l10n/*.arb; chạy lại 'flutter gen-l10n' rồi commit lib/l10n" >&2
            exit 1
          fi
          echo "OK: code gen-l10n khớp lib/l10n/*.arb"

      - name: Code Pigeon sinh ra đã cập nhật (AD-14, AD-19)
        run: |
          dart run pigeon --input pigeons/platform_api.dart
          # Bắt cả file bị sửa tay, bị xóa (thiếu), chưa commit hay output mới.
          changes="$(git status --porcelain -- lib android ios)"
          if [[ -n "$changes" ]]; then
            echo "$changes"
            git --no-pager diff -- lib android ios
            echo "Code Pigeon chưa khớp pigeons/platform_api.dart; chạy lại 'dart run pigeon --input pigeons/platform_api.dart' rồi commit" >&2
            exit 1
          fi
          echo "OK: code Pigeon khớp pigeons/platform_api.dart"

      - name: Fixture vault khớp script (AD-20)
        run: |
          # Script tự build libsodium qua build hook của sodium (gcc/make có sẵn).
          dart run tool/fixtures/gen_vault_v1.dart
          changes="$(git status --porcelain -- test/fixtures/vault)"
          if [[ -n "$changes" ]]; then
            echo "$changes"
            git --no-pager diff --stat -- test/fixtures/vault
            echo "Fixture vault chưa khớp tool/fixtures/gen_vault_v1.dart; chạy lại script rồi commit test/fixtures/vault" >&2
            exit 1
          fi
          echo "OK: fixture vault khớp script"

      - name: Phân tích tĩnh
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Luật import (AD-1, AD-2)
        run: dart run tool/check_imports.dart

      - name: Unit + widget test
        run: flutter test

      - name: Build APK release (prod)
        run: flutter build apk --release --flavor prod --build-number "$GITHUB_RUN_NUMBER"

      - name: Kiểm APK prod (INTERNET, backup, 16 KB, applicationId)
        run: bash tool/ci/check_android_apk.sh build/app/outputs/flutter-apk/app-prod-release.apk --expect-id io.github.truongthanhnam.pakmanager

      - name: Build APK release (dev)
        run: flutter build apk --release --flavor dev --build-number "$GITHUB_RUN_NUMBER"

      - name: Kiểm APK dev (INTERNET, backup, 16 KB, applicationId)
        run: bash tool/ci/check_android_apk.sh build/app/outputs/flutter-apk/app-dev-release.apk --expect-id io.github.truongthanhnam.pakmanager.dev

  ios:
    name: Build iOS (no codesign)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Chọn Xcode 26.3
        run: |
          test -d /Applications/Xcode_26.3.app || { echo "Xcode 26.3 không có trên runner macos-15" >&2; exit 1; }
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Cài Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          # Tag có thể bị dời: so revision thật với .metadata (AD-12, AD-18).
          expected="$(grep -m1 -E '^  revision:' .metadata | grep -oE '[0-9a-f]{40}' || true)"
          actual="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "Flutter clone có revision $actual, khác revision '$expected' trong .metadata" >&2
            exit 1
          fi
          echo "OK: Flutter revision $actual khớp .metadata"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: |
          flutter config --no-analytics
          flutter --version

      - name: Pub get (theo pubspec.lock)
        run: flutter pub get --enforce-lockfile

      # pbxproj sửa tay (story 1.14): kiểm cú pháp trước để lỗi rõ ràng.
      - name: Kiểm cú pháp project.pbxproj
        run: plutil -lint ios/Runner.xcodeproj/project.pbxproj

      # Build không cờ (scheme Runner, cấu hình gốc) — phải giữ id và tên prod (AD-19).
      - name: Build iOS release (không cờ)
        run: flutter build ios --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"

      - name: Kiểm bundle id build không cờ
        run: |
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist)"
          if [[ "$actual" != "io.github.truongthanhnam.pakmanager" ]]; then
            echo "Bundle id build không cờ sai: '$actual'" >&2
            exit 1
          fi
          name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphoneos/Runner.app/Info.plist)"
          if [[ "$name" != "PAK Manager" ]]; then
            echo "Tên hiển thị build không cờ sai: '$name'" >&2
            exit 1
          fi
          echo "OK: build không cờ $actual, tên hiển thị $name"

      - name: Build iOS release (flavor prod)
        run: flutter build ios --release --no-codesign --flavor prod --build-number "$GITHUB_RUN_NUMBER"

      - name: Kiểm bundle id prod
        run: |
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist)"
          if [[ "$actual" != "io.github.truongthanhnam.pakmanager" ]]; then
            echo "Bundle id prod sai: '$actual'" >&2
            exit 1
          fi
          name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphoneos/Runner.app/Info.plist)"
          if [[ "$name" != "PAK Manager" ]]; then
            echo "Tên hiển thị prod sai: '$name'" >&2
            exit 1
          fi
          echo "OK: bundle id prod $actual, tên hiển thị $name"

      - name: Build iOS release (flavor dev)
        run: flutter build ios --release --no-codesign --flavor dev --build-number "$GITHUB_RUN_NUMBER"

      - name: Kiểm bundle id dev
        run: |
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist)"
          if [[ "$actual" != "io.github.truongthanhnam.pakmanager.dev" ]]; then
            echo "Bundle id dev sai: '$actual'" >&2
            exit 1
          fi
          name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphoneos/Runner.app/Info.plist)"
          if [[ "$name" != "PAK Manager Dev" ]]; then
            echo "Tên hiển thị dev sai: '$name'" >&2
            exit 1
          fi
          echo "OK: bundle id dev $actual, tên hiển thị $name"

  # Integration test API native trên emulator Android thật (AD-14, AD-11, NFR-8).
  integration-android:
    name: Integration test Android (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Bật KVM cho emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cài Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          # Tag có thể bị dời: so revision thật với .metadata (AD-12, AD-18).
          expected="$(grep -m1 -E '^  revision:' .metadata | grep -oE '[0-9a-f]{40}' || true)"
          actual="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "Flutter clone có revision $actual, khác revision '$expected' trong .metadata" >&2
            exit 1
          fi
          echo "OK: Flutter revision $actual khớp .metadata"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: |
          flutter config --no-analytics
          flutter --version

      - name: Pub get (theo pubspec.lock)
        run: flutter pub get --enforce-lockfile

      - name: Integration test trên emulator API 34
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: pak_manager
          script: flutter test integration_test --flavor dev

  # Integration test API native trên simulator iOS (AD-14, AD-11, NFR-8).
  integration-ios:
    name: Integration test iOS (simulator)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Chọn Xcode 26.3
        run: |
          test -d /Applications/Xcode_26.3.app || { echo "Xcode 26.3 không có trên runner macos-15" >&2; exit 1; }
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Cài Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          # Tag có thể bị dời: so revision thật với .metadata (AD-12, AD-18).
          expected="$(grep -m1 -E '^  revision:' .metadata | grep -oE '[0-9a-f]{40}' || true)"
          actual="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "Flutter clone có revision $actual, khác revision '$expected' trong .metadata" >&2
            exit 1
          fi
          echo "OK: Flutter revision $actual khớp .metadata"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: |
          flutter config --no-analytics
          flutter --version

      - name: Pub get (theo pubspec.lock)
        run: flutter pub get --enforce-lockfile

      - name: Boot simulator iPhone
        timeout-minutes: 15
        run: |
          # Chọn iPhone khả dụng đầu tiên của runtime iOS mới nhất.
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in data if "iOS" in r), key=lambda r: [int(x) for x in r.rsplit("iOS-", 1)[-1].split("-") if x.isdigit()])
          for r in reversed(runtimes):
              for d in data[r]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("không tìm thấy simulator iPhone")
          ')"
          echo "Simulator: $udid"
          # Đã boot sẵn thì bỏ qua; bootstatus vẫn fail nếu không boot được.
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

      - name: Integration test trên simulator
        run: flutter test integration_test -d "$SIM_UDID"
